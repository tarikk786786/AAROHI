<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AAROHI">
  <!-- AAROHI mark: soft rose A monogram — readable at favicon size -->
  <defs>
    <linearGradient id="aFill" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6B59A"/>
      <stop offset="45%" stop-color="#E97868"/>
      <stop offset="100%" stop-color="#C94B4B"/>
    </linearGradient>
    <linearGradient id="aShine" x1="160" y1="120" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6F0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF6F0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#C94B4B" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#F7F1EC"/>
  <g filter="url(#soft)">
    <!-- Outer A silhouette -->
    <path fill="url(#aFill)" d="M256 78
      C278 78 294 92 304 118
      L428 390
      C434 404 428 420 412 424
      C398 428 384 420 378 406
      L348 330
      H164
      L134 406
      C128 420 114 428 100 424
      C84 420 78 404 84 390
      L208 118
      C218 92 234 78 256 78 Z
      M256 168
      L196 298
      H316
      Z"/>
    <!-- Inner counter (negative space) -->
    <path fill="#F7F1EC" d="M256 188 L214 286 H298 Z"/>
    <!-- Soft highlight stroke on left stem -->
    <path d="M232 150 C220 190 204 240 190 286" fill="none" stroke="url(#aShine)" stroke-width="18" stroke-linecap="round"/>
    <!-- Tiny spark at apex -->
    <circle cx="256" cy="96" r="10" fill="#FFF8F3"/>
    <circle cx="256" cy="96" r="4.5" fill="#F4A261"/>
  </g>
</svg>
